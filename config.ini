; ============================================================
; 文件监控增量同步程序 配置文件
; 所有路径使用绝对路径；支持多组同步对（[pair_1] [pair_2] ...）
; 每个 pair 通过 type 选择目标端类型：local / smb / ftp
; 修改本文件后重启程序生效
; ============================================================

[general]
; 防抖间隔(秒)：文件连续写入时，停止变化多少秒后再执行同步，避免半成品文件
debounce_seconds = 2
; 启动时是否先做一次全量扫描同步（把已有差异补齐）
initial_full_scan = true
; 源端删除文件/目录时，是否同步删除目标端对应内容
delete_on_source_delete = true
; 日志级别：DEBUG / INFO / WARNING / ERROR
log_level = INFO
; 日志文件路径（留空则只输出到控制台）
log_file = sync.log
; 每次复制后是否校验文件大小（mismatch 会重试一次）
verify_size = true

; ---------------- 同步对 1：本地磁盘（默认） ----------------
; type 省略或写 local，target 为本地路径或盘符路径
[pair_1]
type = local
source = D:\synchronize
target = D:\synchronize_backup

; ---------------- 示例：共享文件夹（SMB） ----------------
; 复制下面这段，改名为 pair_2 即可启用
; [pair_2]
; type = smb
; source = D:\synchronize
; target = \\192.168.1.20\backup
; ; 目标共享需要账号密码时填写；留空则使用当前 Windows 登录身份
; username = backup_user
; password = 123456

; ---------------- 示例：FTP ----------------
; 复制下面这段，改名为 pair_3 即可启用
; [pair_3]
; type = ftp
; source = D:\synchronize
; target = ftp://192.168.1.30:21/backup
; ; 用户名留空则按匿名（anonymous）登录
; username = test
; password = 123456
; ; 被动模式，一般保持 true；服务器在 NAT 后必须为 true
; passive = true
; ; FTPS（显式 TLS），服务器支持时可改为 true
; tls = false
